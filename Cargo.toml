[package]
name = "verbaq"
version = "1.2.0"
edition = "2021"
rust-version = "1.88"
description = "Local dictation for Linux. Press a key, speak, text appears."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/TacTalaPaca/verbaq"
default-run = "verbaq"

[dependencies]
anyhow = "1.0.105"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.5.61", features = ["derive"] }
cpal = "0.17.3"
crossterm = "0.29.0"
dirs = "7.0.0"
evdev = "0.13.2"
hex = "0.4.3"
hound = "3.5.1"
libc = "0.2.191"
ratatui = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
toml = "1.0.7"
ureq = "2"
whisper-rs = "0.16.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
